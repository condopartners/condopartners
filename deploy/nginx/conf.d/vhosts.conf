map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Docker embedded DNS — resolve upstreams at request time (nginx -t sem stack).
resolver 127.0.0.11 ipv6=off valid=30s;

# --- prod: landing ---
server {
    listen 80;
    server_name condopartners.com.br www.condopartners.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name condopartners.com.br www.condopartners.com.br;

    # Paths filled by certbot (or hooks). Dummy/self-signed ok for nginx -t in CI.
    ssl_certificate /etc/letsencrypt/live/condopartners.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/condopartners.com.br/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    location / {
        include /etc/nginx/snippets/proxy-headers.conf;
        set $upstream_landing landing;
        proxy_pass http://$upstream_landing:80;
    }
}

