# CondoPartners shared edge — SIS-40 / SIS-114
# Host terminates TLS (interim self-signed until LE after DNS cutover).
# Upstream: stack nginx HTTPS (prod :9443, dev :8443).
#
# Apply on VPS:
#   sudo cp deploy/nginx/edge/condopartners-edge.conf /etc/nginx/sites-available/condopartners-edge
#   sudo nginx -t && sudo systemctl reload nginx

upstream cp_prod {
    server 127.0.0.1:9443;
}
upstream cp_dev {
    server 127.0.0.1:8443;
}
upstream cp_portainer {
    server 127.0.0.1:9000;
}

map $host $cp_upstream {
    default                        cp_prod;
    app-dev.condopartners.com.br   cp_dev;
    api-dev.condopartners.com.br   cp_dev;
    portainer.condopartners.com.br cp_portainer;
}

server {
    listen 80;
    server_name condopartners.com.br www.condopartners.com.br
                app.condopartners.com.br api.condopartners.com.br
                app-dev.condopartners.com.br api-dev.condopartners.com.br
                portainer.condopartners.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name condopartners.com.br www.condopartners.com.br
                app.condopartners.com.br api.condopartners.com.br
                app-dev.condopartners.com.br api-dev.condopartners.com.br;

    ssl_certificate     /etc/nginx/ssl/condopartners/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/condopartners/privkey.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass https://$cp_upstream;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}

server {
    listen 443 ssl;
    server_name portainer.condopartners.com.br;

    ssl_certificate     /etc/nginx/ssl/condopartners/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/condopartners/privkey.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
