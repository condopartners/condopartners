# CondoPartners — stack dev image-based (Portainer CE)
# Isolado de prod: sufixo -dev em rede/volumes/portas.
# Use este arquivo no Portainer. Não usa `build:`. Binds absolutos via DEPLOY_ROOT.
# Ver deploy/README.md § image-based.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - condopartners_pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - condopartners-dev

  api:
    image: ${API_IMAGE:-condopartners-dev-api:latest}
    restart: unless-stopped
    environment:
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - condopartners-dev

  web:
    image: ${WEB_IMAGE:-condopartners-dev-web:latest}
    restart: unless-stopped
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - condopartners-dev

  landing:
    image: ${LANDING_IMAGE:-condopartners-dev-landing:latest}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - condopartners-dev

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ${DEPLOY_ROOT}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${DEPLOY_ROOT}/nginx/conf.d:/etc/nginx/conf.d:ro
      - ${DEPLOY_ROOT}/nginx/snippets:/etc/nginx/snippets:ro
      - condopartners_certs_dev:/etc/letsencrypt:ro
      - condopartners_certbot_www_dev:/var/www/certbot:ro
    depends_on:
      - api
      - web
      - landing
    networks:
      - condopartners-dev

volumes:
  condopartners_pgdata_dev:
  condopartners_certs_dev:
  condopartners_certbot_www_dev:

networks:
  condopartners-dev:
    name: condopartners-dev
