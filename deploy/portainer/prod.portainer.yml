# CondoPartners — stack prod image-based (Portainer CE)
# Use este arquivo no Portainer (Web editor / Git / file). Não usa `build:`.
# Pré-req: imagens já buildadas no host (ou registry) + DEPLOY_ROOT absoluto.
# Ver deploy/README.md § image-based. NÃO use binds relativos (`../nginx`) — quebram sob /data/compose.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - condopartners_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - condopartners

  api:
    image: ${API_IMAGE:-condopartners-prod-api:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL}
      WEB_ORIGIN: ${WEB_ORIGIN}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - condopartners

  web:
    image: ${WEB_IMAGE:-condopartners-prod-web:latest}
    restart: unless-stopped
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - condopartners

  landing:
    image: ${LANDING_IMAGE:-condopartners-prod-landing:latest}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - condopartners

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ${DEPLOY_ROOT}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${DEPLOY_ROOT}/nginx/conf.d:/etc/nginx/conf.d:ro
      - ${DEPLOY_ROOT}/nginx/snippets:/etc/nginx/snippets:ro
      - condopartners_certs:/etc/letsencrypt:ro
      - condopartners_certbot_www:/var/www/certbot:ro
    depends_on:
      - api
      - web
      - landing
    networks:
      - condopartners

volumes:
  condopartners_pgdata:
  condopartners_certs:
  condopartners_certbot_www:

networks:
  condopartners:
    name: condopartners
