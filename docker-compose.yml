services:
  db:
    image: postgres:17-alpine
    container_name: condopartners-db
    restart: unless-stopped
    ports:
      # Host 5432 is often already taken; map local Postgres to 5433.
      - "5433:5432"
    environment:
      POSTGRES_DB: condopartners
      POSTGRES_USER: condopartners
      POSTGRES_PASSWORD: condopartners
    volumes:
      - condopartners_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U condopartners -d condopartners"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  condopartners_pgdata:
